# ============================================================
# perf_monitor.conf  -  パフォーマンスモニター 設定ファイル
# 優先順位: CLI引数 > このファイル > スクリプト内既定値
# ============================================================

# ── 収集設定 ────────────────────────────────────────────────
# 収集間隔（秒）
Interval        = 5

# 収集期間（秒）。0 = stop コマンドで明示停止するまで継続
Duration        = 0

# 出力ディレクトリ（セッションサブディレクトリがここに作られる）
OutputDir       = .

# セッションディレクトリ名のプレフィックス
OutputPrefix    = perf

# ── 収集メトリクス ───────────────────────────────────────────
# all: 取得可能な全メトリクス
# または以下をカンマ区切りで指定:
#   cpu         CPU 使用率（全体）
#   memory      メモリ / スワップ使用率
#   disk        ディスク I/O（読み書き MB/s）
#   network     ネットワーク（受信/送信 Mbps）
#   loadavg     ロードアベレージ（Linux のみ）
#   process     プロセス数（Linux）/ ページファイル（Windows）
Metrics         = all

# ── しきい値（0 = 無効、超過時に警告ログ＋レポートでハイライト）────
ThresholdCpuPct         = 80.0
ThresholdMemPct         = 85.0
ThresholdDiskReadMBps   = 500.0
ThresholdDiskWriteMBps  = 500.0
ThresholdNetRxMbps      = 900.0
ThresholdNetTxMbps      = 900.0
ThresholdLoadAvg1       = 4.0

# ── ログ ────────────────────────────────────────────────────
LogFile         =
LogLevel        = INFO
