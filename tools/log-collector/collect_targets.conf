# Evidence collection target presets
#
# Format:
#   [preset_name]
#   path = glob pattern (one per line, multiple allowed)
#   max_file_size_mb = max size per individual file (default: 100)
#
# Usage:
#   LogCollector.ps1 -Target tomcat,os
#   log_collector.sh -t nginx,postgresql

# ---- Application Servers ----

[tomcat]
# Windows: C:\tomcat\logs\*  /  Linux: /opt/tomcat/logs/*
path = /opt/tomcat/logs/*.log
path = /opt/tomcat/logs/*.txt
path = C:\tomcat\logs\*.log
path = C:\tomcat\logs\*.txt
max_file_size_mb = 50

[nginx]
path = /var/log/nginx/*.log
path = C:\nginx\logs\*.log
max_file_size_mb = 100

# ---- Databases ----

[postgresql]
path = /var/log/postgresql/*.log
path = /var/lib/postgresql/*/data/log/*.log
path = C:\PostgreSQL\*\data\log\*.log
max_file_size_mb = 100

[mysql]
path = /var/log/mysql/*.log
path = /var/log/mysql/*.err
path = C:\ProgramData\MySQL\*\Data\*.err
path = C:\ProgramData\MySQL\*\Data\*.log
max_file_size_mb = 100

# ---- Operating System ----

[os]
# Linux
path = /var/log/syslog
path = /var/log/messages
path = /var/log/auth.log
path = /var/log/kern.log
path = /var/log/dmesg
# Windows
path = C:\Windows\Logs\CBS\*.log
max_file_size_mb = 200

# ---- SAP / HANA ----

[hana]
path = /usr/sap/*/HDB*/*/trace/*.trc
path = /usr/sap/*/HDB*/*/trace/*.log
max_file_size_mb = 200

[sap]
path = /usr/sap/*/D*/work/*.log
path = /usr/sap/*/D*/work/*.trc
max_file_size_mb = 100
