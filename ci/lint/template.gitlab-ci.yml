template-check:
  stage: lint
  image: alpine:3.20
  tags:
    - linux
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "scripts/**/*"
        - "tools/templates/**/*"
        - "ci/template-check/**/*"
        - "ci/lint/template.gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache bash grep findutils gawk
  script:
    - bash ci/template-check/check_template.sh
