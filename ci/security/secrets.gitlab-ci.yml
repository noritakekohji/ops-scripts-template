gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  tags:
    - linux
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - >
      gitleaks detect
      --source .
      --config .gitleaks.toml
      --redact
      --report-path gitleaks-report.json
      --report-format json
      --exit-code 1
      --verbose
  artifacts:
    when: on_failure
    paths:
      - gitleaks-report.json
    expire_in: 1 month
