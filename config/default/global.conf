# Cross-script defaults (apply to every script in every environment).
# Override per-script in <script>.conf, or per-env in config/<env>/global.conf.

# Default AWS region. CLI -Region / -r overrides this.
# Region = ap-northeast-1

# File logging (applies to all scripts that use Write-OpsLog).
# LogFile  = path to the log file. Relative paths are resolved from the working
#            directory. Leave empty or comment out to disable file logging.
# LogLevel = minimum severity level written to the log file (DEBUG/INFO/WARN/ERROR).
#            Default: INFO
# LogFile = C:\ProgramData\ops-scripts\logs\ops.log
LogLevel = INFO
