# hanactl.conf  -  SAP HANA Database ライフサイクル制御 設定
# 優先順位: CLI 引数 > このファイル > スクリプト既定値

# HANA System ID（SID）例: HDB, PRD, QAS
# -S オプションで上書き可能
SID =

# インスタンス番号（2桁）例: 00, 01
# -N オプションで上書き可能
InstanceNumber =

# 待機タイムアウト秒（start/stop -w 時）HANA は起動に時間がかかるため長めに設定
WaitTimeoutSec = 300

Wait = false
LogFile =
LogLevel = INFO
