# sapctl.conf  -  SAP システム（S/4HANA / NetWeaver）ライフサイクル制御 設定
# 優先順位: CLI 引数 > このファイル > スクリプト既定値

# SAP System ID（SID）例: S4H, ECC, PRD
# -S オプションで上書き可能
SID =

# インスタンス番号（2桁）例: 00, 01
# -N オプションで上書き可能
InstanceNumber =

# 待機タイムアウト秒（start/stop -w 時）SAP の起動は時間がかかるため長めに設定
WaitTimeoutSec = 600

Wait = false
LogFile =
LogLevel = INFO
